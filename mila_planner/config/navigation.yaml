mila_saved_map_server:
  ros__parameters:
    yaml_file: /maps/global_map.yaml
    frame_id: map

mila_navigation:
  ros__parameters:
    # Coordinates are metres/radians in the saved map frame. They anchor the
    # first odometry pose after startup; /initialpose can replace this anchor.
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0
    use_parameter_initial_pose: true
    goal_x: 0.0
    goal_y: 0.0
    use_parameter_goal: false
    control_hz: 20.0
    goal_tolerance_m: 0.15
    odom_timeout_s: 0.30
    status_timeout_s: 1.5
    footprint_length_m: 0.60
    footprint_width_m: 0.45
    safety_margin_m: 0.30
    min_turning_radius_m: 0.70
    unknown_cost: 4.0
    occupied_threshold: 65
    planner_heuristic_weight: 5.0
    use_local_costmap: false

mila_safety_supervisor:
  ros__parameters:
    # Until local obstacle sensing is implemented, physical motion is opt-in.
    navigation_enabled: false
    publish_hz: 20.0
    command_timeout_s: 0.25
    odometry_timeout_s: 0.30
    status_timeout_s: 1.5
    minimum_linear_mps: 0.04
    maximum_linear_mps: 0.15
    maximum_acceleration_mps2: 0.10
    maximum_deceleration_mps2: 0.20
    minimum_turning_radius_m: 0.70

